{% extends "imoveis/base.html" %}

{% block content %}

<div class="card">

    <div class="card-body p-4">

        <h2 class="mb-3 fw-bold">
            Retirar chave
        </h2>

        <p class="text-muted mb-4">
            Informe os dados do cliente que ficará com a chave.
        </p>

        <div class="alert alert-light border">

            <strong>Imóvel:</strong>
            {{ chave.imovel.codigo }}

            <br>

            <strong>Endereço:</strong>
            {{ chave.imovel.endereco }}

            <br>

            <strong>Bairro:</strong>
            {{ chave.imovel.bairro }}

        </div>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="d-flex gap-2 flex-wrap mt-4">

                <button type="submit" class="btn btn-primary">
                    Confirmar retirada
                </button>

                <a href="{% url 'chave_list' %}" class="btn btn-secondary">
                    Cancelar
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}

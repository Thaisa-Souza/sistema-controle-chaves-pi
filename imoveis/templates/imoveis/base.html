<!DOCTYPE html>
<html>
<head>
  <title>Controle de Chaves</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
  <div class="container d-flex justify-content-between">
    <a class="navbar-brand" href="{% url 'imovel_list' %}">Controle de Chaves</a>

    <div>
      <a href="{% url 'chave_list' %}" class="btn btn-light btn-sm">Chaves</a>
      <a href="{% url 'imovel_list' %}" class="btn btn-light btn-sm">Imóveis</a>
      <a href="{% url 'historico_list' %}" class="btn btn-light btn-sm">Histórico</a>
    </div>
  </div>
</nav>

<div class="container">
  {% if messages %}

    {% for message in messages %}

        <div class="alert alert-success alert-dismissible fade show" role="alert">

            {{ message }}

            <button
                type="button"
                class="btn-close"
                data-bs-dismiss="alert">
            </button>

        </div>

    {% endfor %}

{% endif %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

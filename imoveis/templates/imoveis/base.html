<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <title>CasaBella • Controle de Chaves</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .navbar {
            background-color: #0d1b2a !important;
        }

        .navbar-brand {
            font-size: 1.2rem;
            letter-spacing: 0.5px;
        }

        .card {
            border: none;
            border-radius: 16px;
            transition: 0.2s;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .btn {
            border-radius: 10px;
            transition: 0.2s;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background-color: #1b263b;
            border: none;
        }

        .btn-primary:hover {
            background-color: #415a77;
        }

        .btn-success {
            background-color: #2d6a4f;
            border: none;
        }

        .btn-warning {
            border: none;
        }

        .badge {
            font-size: 0.85rem;
        }

        .table-primary {
            background-color: #1b263b !important;
        }

        @media (max-width: 991px) {
            .navbar .ms-auto {
                flex-direction: column;
                width: 100%;
            }

            .navbar .btn,
            .navbar form {
                width: 100%;
            }

            .navbar .btn {
                text-align: center;
            }
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">

    <div class="container">

        <a class="navbar-brand fw-bold" href="{% url 'imovel_list' %}">
            CasaBella • Controle de Chaves
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <div class="ms-auto d-flex gap-2 mt-3 mt-lg-0">

                <a href="{% url 'imovel_list' %}" class="btn btn-light btn-sm">
                    Imóveis
                </a>

                <a href="{% url 'chave_list' %}" class="btn btn-light btn-sm">
                    Chaves
                </a>

                <a href="{% url 'historico_list' %}" class="btn btn-light btn-sm">
                    Histórico
                </a>

                <form action="{% url 'logout' %}" method="post" class="d-inline">
                    {% csrf_token %}

                    <button type="submit" class="btn btn-outline-light btn-sm">
                        Sair
                    </button>
                </form>

            </div>

        </div>

    </div>

</nav>

<div class="container py-2">

    {% if messages %}

        {% for message in messages %}

            <div class="alert alert-{{ message.tags }} shadow-sm alert-dismissible fade show"
                 role="alert">

                {{ message }}

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                </button>

            </div>

        {% endfor %}

    {% endif %}

    {% block content %}{% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

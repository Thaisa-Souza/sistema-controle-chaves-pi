{% extends "imoveis/base.html" %}

{% block content %}

<h1 class="mb-4">Chaves</h1>


<div class="table-responsive">

<table class="table table-striped table-bordered align-middle">

    <thead class="table-primary">

        <tr>
            <th>Imóvel</th>
            <th>Status</th>
            <th>Ações</th>
        </tr>

    </thead>

    <tbody>

        {% for chave in chaves %}

        <tr>

            <td>{{ chave.imovel.codigo }}</td>

            <td>{{ chave.status }}</td>

            <td>

                {% if chave.status == 'disponivel' %}

                <a href="{% url 'retirar_chave' chave.id %}"
                   class="btn btn-primary btn-sm">
                    Retirar
                </a>

                {% else %}

                <a href="{% url 'devolver_chave' chave.id %}"
                   class="btn btn-success btn-sm">
                    Devolver
                </a>

                {% endif %}

            </td>

        </tr>

        {% empty %}

        <tr>
            <td colspan="3">
                Nenhuma chave cadastrada.
            </td>
        </tr>

        {% endfor %}

    </tbody>

</table>

</div>

{% endblock %}
